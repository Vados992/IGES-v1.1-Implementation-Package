name: IGES security and smoke CI
on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Syntax compilation
        run: python -m compileall -q app tests
      - name: Static lint
        run: ruff check app tests
      - name: Unit and fail-closed API tests
        run: python -m pytest -q
      - name: Docker service boot and readiness
        run: |
          cat > .env <<'EOF'
          POSTGRES_ADMIN_PASSWORD=ci_admin_random_not_for_production_2026
          IGES_DB_PASSWORD=ci_runtime_random_not_for_production_2026
          IGES_PUBLIC_PROJECT_ID=00000000-0000-4000-8000-000000000001
          IGES_OIDC_ISSUER=
          IGES_OIDC_AUDIENCE=
          IGES_OIDC_JWKS_URL=
          IGES_DOMAIN=testing.example.org
          IGES_ACME_EMAIL=operator@testing.example.org
          EOF
          docker compose up --build -d
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Fetch real World Bank records and verify provenance
        timeout-minutes: 4
        run: |
          docker compose run --rm api python -m app.seed_worldbank \
            --country PRT --indicator SP.POP.TOTL --start 2022 --end 2024
          curl --fail --silent \
            "http://127.0.0.1:8000/v1/public/observations?country=PRT&indicator=SP.POP.TOTL" \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["count"] >= 1; assert all(r["source_url"].startswith("https://api.worldbank.org/") and len(r["content_sha256"])==64 for r in d["records"]); print("PASS: live source observations with provenance",d["count"])'
      - name: Import live USAspending award records
        timeout-minutes: 4
        run: |
          docker compose run --rm api python -m app.seed_usaspending \
            --fiscal-year 2024 --limit 5
          curl --fail --silent http://127.0.0.1:8000/v1/public/awards \
            | python -c 'import sys,json; d=json.load(sys.stdin); assert d["count"]>=1; assert all(r["source_url"].startswith("https://api.usaspending.gov/") and len(r["request_sha256"])==64 for r in d["records"]); print("PASS: live official award records",d["count"])'
      - name: Verify audit chain and immutable source hashes
        run: docker compose exec -T api python -m app.verify_audit
      - name: Validate public gateway deployment overlay
        run: docker compose -f compose.yaml -f deploy/compose.public.yaml config >/dev/null
      - name: Database permission and RLS assertions
        run: docker compose exec -T api python -m app.verify_invariants
      - name: Public and admin smoke
        run: |
          curl --fail --silent http://127.0.0.1:8000/ | grep -q "IGES"
          curl --fail --silent http://127.0.0.1:8000/v1/public/observations
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            http://127.0.0.1:8000/v1/admin/ingest/worldbank \
            -H 'Content-Type: application/json' \
            -d '{"country":"PRT","indicator":"SP.POP.TOTL","start":2023,"end":2024}')" = "503"
      - name: Logs after test
        if: always()
        run: docker compose logs --tail 120 || true
