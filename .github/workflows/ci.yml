name: IGES security and smoke CI
on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Syntax compilation
        run: python -m compileall -q app tests
      - name: Static lint
        run: ruff check app tests
      - name: Unit and fail-closed API tests
        run: pytest -q
      - name: Docker service boot and readiness
        run: |
          cat > .env <<'EOF'
          POSTGRES_ADMIN_PASSWORD=ci_admin_random_not_for_production_2026
          IGES_DB_PASSWORD=ci_runtime_random_not_for_production_2026
          IGES_PUBLIC_PROJECT_ID=00000000-0000-4000-8000-000000000001
          IGES_OIDC_ISSUER=
          IGES_OIDC_AUDIENCE=
          IGES_OIDC_JWKS_URL=
          EOF
          docker compose up --build -d
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Public and admin smoke
        run: |
          curl --fail --silent http://127.0.0.1:8000/v1/public/observations
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            http://127.0.0.1:8000/v1/admin/ingest/worldbank \
            -H 'Content-Type: application/json' \
            -d '{"country":"PRT","indicator":"SP.POP.TOTL","start":2023,"end":2024}')" = "503"
      - name: Logs after test
        if: always()
        run: docker compose logs --tail 120 || true
